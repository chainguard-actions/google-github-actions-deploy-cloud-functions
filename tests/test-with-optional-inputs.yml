name: Test - Optional Inputs Accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-test-function
          runtime: nodejs20
          project_id: fake-project-123
          region: us-east1
          description: A test Cloud Function
          memory: 256M
          service_timeout: 120s
          ingress_settings: ALLOW_ALL
          environment_variables: |-
            FOO=bar
            BAZ=qux
          labels: |-
            env=test
            team=platform

      - name: Assert action ran (failed gracefully without real GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NAME_OUT: ${{ steps.action.outputs.name }}
          URL_OUT: ${{ steps.action.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "name output: $NAME_OUT"
          echo "url output: $URL_OUT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no GCP credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -n "$NAME_OUT" ]; then
              echo "PASS: action succeeded with name output: $NAME_OUT"
            else
              echo "FAIL: action succeeded but produced no name output"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
