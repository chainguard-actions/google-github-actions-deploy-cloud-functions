name: Test event trigger inputs (no credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-event-function
          runtime: python39
          region: us-central1
          event_trigger_type: google.storage.object.finalize
          event_trigger_resource: projects/_/buckets/my-bucket
          event_trigger_service: storage.googleapis.com
          event_trigger_retry: 'true'
          entry_point: handle_event

      - name: Assert action failed gracefully with event trigger inputs (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but valid if credentials were injected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected without GCP credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
