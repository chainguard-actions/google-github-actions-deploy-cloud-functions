name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-function
          runtime: nodejs20
          project_id: my-gcp-project
          description: "A test Cloud Function"
          labels: |-
            env=test
            team=platform
          entry_point: helloWorld
          environment_variables: |-
            FOO=bar
            BAZ=qux
          memory: 256M
          cpu: "1"
      - name: Assert action ran (expected failure without GCP credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without real GCP credentials.
          # We only verify it was invoked (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran as expected"
