name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-function
          runtime: nodejs20
          project_id: my-gcp-project
          description: 'A test Cloud Function'
          labels: |-
            env=test
            team=platform
          kms_key_name: projects/my-gcp-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key
          vpc_connector: projects/my-gcp-project/locations/us-central1/connectors/my-connector
      - name: Assert action ran (may fail due to missing GCP credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will fail without real GCP credentials; that is expected.
          # We only verify the action was invoked (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked"
