name: Test basic usage - deploy cloud functions
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal function source
        run: |
          mkdir -p /tmp/function-src
          cat > /tmp/function-src/index.js << 'EOF'
          const functions = require('@google-cloud/functions-framework');
          functions.http('helloWorld', (req, res) => {
            res.send('Hello, World!');
          });
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: test-function
          runtime: nodejs20
          region: us-central1
          source_dir: /tmp/function-src

      - name: Assert action ran and failed gracefully (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_NAME: ${{ steps.action.outputs.name }}
          OUTPUT_URL: ${{ steps.action.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output name: $OUTPUT_NAME"
          echo "output url: $OUTPUT_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OUTPUT_NAME" ]; then
              echo "FAIL: action succeeded but name output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with name=$OUTPUT_NAME"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no GCP credentials available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
