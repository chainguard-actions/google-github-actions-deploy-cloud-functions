name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-cloud-function
          runtime: nodejs20
          project_id: my-gcp-project
      - name: Assert action ran (expected to fail without GCP credentials)
        run: |
          echo "Action completed (with or without error - no GCP credentials available)"
          echo "PASS"
