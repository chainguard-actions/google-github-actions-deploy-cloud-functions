name: Test source dir and build inputs (no credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal function source directory
        run: |
          mkdir -p /tmp/function-src
          cat > /tmp/function-src/index.js << 'EOF'
          exports.helloWorld = (req, res) => {
            res.send('Hello, World!');
          };
          EOF
          cat > /tmp/function-src/package.json << 'EOF'
          {
            "name": "hello-world",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-source-function
          runtime: nodejs18
          source_dir: /tmp/function-src
          entry_point: helloWorld
          deploy_timeout: '600'
          build_environment_variables: NODE_ENV=production

      - name: Assert action failed gracefully with source/build inputs (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but valid if credentials were injected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected without GCP credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
