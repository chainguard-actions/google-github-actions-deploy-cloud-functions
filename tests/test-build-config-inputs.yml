name: Test build configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-test-function
          runtime: nodejs20
          description: 'A test Cloud Function for CI'
          entry_point: helloWorld
          build_environment_variables: |-
            BUILD_VAR=build-value
            ANOTHER_VAR=another-value
          build_service_account: build-sa@my-project.iam.gserviceaccount.com
          build_worker_pool: projects/my-project/locations/us-central1/workerPools/my-pool
          docker_repository: projects/my-project/locations/us-central1/repositories/my-repo
          kms_key_name: projects/my-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key
      - name: Assert action ran or failed gracefully (no GCP credentials available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no GCP credentials in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
