name: Test secrets, artifact registry, KMS, env file, and build pool inputs (no real GCP)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-secrets-function
          runtime: python39
          project_id: fake-gcp-project-id
          env_vars_file: ${{ github.workspace }}/hardened/tests/fixtures/env-vars.yaml
          secret_environment_variables: MY_SECRET=projects/fake-project/secrets/my-secret/versions/latest
          secret_volumes: /etc/secrets/my-secret=projects/fake-project/secrets/my-secret/versions/latest
          docker_repository: projects/fake-project/locations/us-central1/repositories/my-repo
          kms_key_name: projects/fake-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key
          build_worker_pool: projects/fake-project/locations/us-central1/workerPools/my-pool
          build_environment_variables_file: ${{ github.workspace }}/hardened/tests/fixtures/build-env-vars.yaml

      - name: Assert action ran (failed gracefully without real GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but valid if real credentials were injected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected without real GCP credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
