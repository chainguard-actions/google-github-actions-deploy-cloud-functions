name: Test security and networking inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-cloud-function
          runtime: nodejs20
          project_id: my-gcp-project
          kms_key_name: projects/my-gcp-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key
          vpc_connector: projects/my-gcp-project/locations/us-central1/connectors/my-connector
      - name: Assert action ran (expected failure without GCP credentials)
        run: |
          echo "Action completed (with or without error — no GCP credentials available in test)"
          echo "PASS: security and networking inputs were accepted"
