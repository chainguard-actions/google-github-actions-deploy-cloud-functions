name: Test default inputs - deploy cloud functions
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal function source
        run: |
          mkdir -p /tmp/fn-defaults
          cat > /tmp/fn-defaults/main.py << 'EOF'
          import functions_framework

          @functions_framework.http
          def hello(request):
              return "Hello!"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: test-defaults-function
          runtime: python311
          # region defaults to us-central1
          # environment defaults to GEN_2
          # all_traffic_on_latest_revision defaults to true
          # service_timeout defaults to 60s
          # ingress_settings defaults to ALLOW_ALL
          source_dir: /tmp/fn-defaults

      - name: Assert action ran and failed gracefully (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_NAME: ${{ steps.action.outputs.name }}
          OUTPUT_URL: ${{ steps.action.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output name: $OUTPUT_NAME"
          echo "output url: $OUTPUT_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OUTPUT_NAME" ]; then
              echo "FAIL: action succeeded but name output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with name=$OUTPUT_NAME url=$OUTPUT_URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no GCP credentials available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
