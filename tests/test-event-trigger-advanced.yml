name: Test deploy with advanced event trigger options
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-advanced-event-function
          runtime: nodejs20
          region: us-central1
          environment: GEN_2
          event_trigger_type: 'google.cloud.audit.log.v1.written'
          event_trigger_location: 'us-central1'
          event_trigger_retry: 'true'
          event_trigger_service_account: trigger-sa@my-gcp-project.iam.gserviceaccount.com
          event_trigger_filters: |-
            serviceName=compute.googleapis.com
            methodName=PATTERN:compute.instances.*
          event_trigger_channel: projects/my-gcp-project/locations/us-central1/channels/my-channel

      - name: Assert action ran and failed gracefully (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          URL: ${{ steps.action.outputs.url }}
          FUNC_NAME: ${{ steps.action.outputs.name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "name: $FUNC_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FUNC_NAME" ]; then
              echo "FAIL: action succeeded but name output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with name=$FUNC_NAME"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no GCP credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
