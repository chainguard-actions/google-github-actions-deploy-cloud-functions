name: Test service configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-service-function
          runtime: nodejs20
          project_id: my-gcp-project
          max_instance_count: "10"
          min_instance_count: "1"
          max_instance_request_concurrency: "80"
          secrets: |-
            MY_SECRET=projects/my-gcp-project/secrets/my-secret/versions/latest
          service_account: runtime-sa@my-gcp-project.iam.gserviceaccount.com
          vpc_connector: projects/my-gcp-project/locations/us-central1/connectors/my-connector
      - name: Assert action ran (expected failure without GCP credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran as expected"
