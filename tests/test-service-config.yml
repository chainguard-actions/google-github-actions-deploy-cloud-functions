name: Test service configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-cloud-function
          runtime: nodejs20
          project_id: my-gcp-project
          description: My Cloud Function description
          labels: |-
            env=production
            team=backend
          cpu: '1'
          memory: 256M
          environment_variables: |-
            FRUIT=apple
            COLOR=blue
          max_instance_count: '10'
          max_instance_request_concurrency: '5'
          min_instance_count: '1'
          secrets: |-
            API_KEY=secret-api-key:latest
          service_account: runtime-sa@my-gcp-project.iam.gserviceaccount.com
          vpc_connector: projects/my-gcp-project/locations/us-central1/connectors/my-connector
      - name: Assert action ran (expected to fail without GCP credentials)
        run: |
          echo "Action completed (with or without error - no GCP credentials available)"
          echo "PASS"
