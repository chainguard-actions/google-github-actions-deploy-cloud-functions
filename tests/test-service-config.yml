name: Test service config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-function
          runtime: nodejs20
          project_id: my-gcp-project
          cpu: '1'
          memory: 256M
          environment_variables: |-
            FRUIT=apple
            COLOR=blue
          max_instance_count: '10'
          max_instance_request_concurrency: '80'
          min_instance_count: '1'
          service_account: runtime-sa@my-gcp-project.iam.gserviceaccount.com
          secrets: |-
            API_KEY=secret-api-key:latest
            /secrets/db/password=secret-db-password:latest
      - name: Assert action ran (may fail due to missing GCP credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked"
