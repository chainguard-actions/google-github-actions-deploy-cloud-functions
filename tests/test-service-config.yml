name: Test service configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-cloud-function
          runtime: nodejs20
          project_id: my-gcp-project
          description: My test Cloud Function
          labels: |-
            env=test
            team=platform
          environment_variables: |-
            APP_ENV=production
            LOG_LEVEL=info
          cpu: '1'
          memory: 256M
          min_instance_count: '1'
          max_instance_count: '10'
          max_instance_request_concurrency: '80'
          service_account: runtime-sa@my-gcp-project.iam.gserviceaccount.com
          secrets: |-
            API_KEY=projects/my-gcp-project/secrets/api-key/versions/latest
      - name: Assert action ran (expected failure without GCP credentials)
        run: |
          echo "Action completed (with or without error — no GCP credentials available in test)"
          echo "PASS: service config inputs were accepted"
