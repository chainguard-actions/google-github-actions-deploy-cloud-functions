name: Test - Custom Source Directory
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Cloud Function source directory
        run: |
          mkdir -p /tmp/my-function
          cat > /tmp/my-function/index.js << 'EOF'
          exports.helloWorld = (req, res) => {
            res.send('Hello, World!');
          };
          EOF
          cat > /tmp/my-function/package.json << 'EOF'
          {
            "name": "my-function",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: hello-world-function
          runtime: nodejs20
          project_id: fake-project-456
          source_dir: /tmp/my-function
          entry_point: helloWorld

      - name: Assert action ran (failed gracefully without real GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NAME_OUT: ${{ steps.action.outputs.name }}
          URL_OUT: ${{ steps.action.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "name output: $NAME_OUT"
          echo "url output: $URL_OUT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no GCP credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -n "$NAME_OUT" ]; then
              echo "PASS: action succeeded with name output: $NAME_OUT"
            else
              echo "FAIL: action succeeded but produced no name output"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
