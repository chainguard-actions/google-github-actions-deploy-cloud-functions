name: Test environment variables and labels inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal function source
        run: |
          mkdir -p /tmp/fn-env
          cat > /tmp/fn-env/index.js << 'EOF'
          const functions = require('@google-cloud/functions-framework');
          functions.http('envTest', (req, res) => {
            res.send(process.env.MY_VAR || 'no var');
          });
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: test-env-function
          runtime: nodejs20
          region: us-central1
          source_dir: /tmp/fn-env
          environment_variables: |-
            MY_VAR=hello
            ANOTHER_VAR=world
          build_environment_variables: |-
            BUILD_VAR=build-value
          labels: |-
            env=test
            team=platform
          description: A test function with env vars and labels
          memory: 256M
          service_timeout: 30s
          max_instance_count: 5
          min_instance_count: 0

      - name: Assert action ran and failed gracefully (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_NAME: ${{ steps.action.outputs.name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output name: $OUTPUT_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OUTPUT_NAME" ]; then
              echo "FAIL: action succeeded but name output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with name=$OUTPUT_NAME"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no GCP credentials available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
