name: Test deploy with optional configuration inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-test-function
          runtime: nodejs20
          region: us-central1
          description: 'A test Cloud Function'
          environment: GEN_2
          memory: 256M
          cpu: '1'
          min_instance_count: '0'
          max_instance_count: '5'
          service_timeout: '120s'
          ingress_settings: ALLOW_ALL
          all_traffic_on_latest_revision: 'true'
          environment_variables: |-
            FOO=bar
            BAZ=qux
          labels: |-
            env=test
            team=platform

      - name: Assert action ran and failed gracefully (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          URL: ${{ steps.action.outputs.url }}
          FUNC_NAME: ${{ steps.action.outputs.name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "name: $FUNC_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FUNC_NAME" ]; then
              echo "FAIL: action succeeded but name output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with name=$FUNC_NAME"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no GCP credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
