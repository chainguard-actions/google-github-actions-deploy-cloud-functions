name: Test service configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-service-function
          runtime: nodejs20
          service_account: runtime-sa@my-project.iam.gserviceaccount.com
          max_instance_request_concurrency: 10
          secrets: |-
            MY_SECRET=projects/my-project/secrets/my-secret/versions/latest
            /secrets/api/key=projects/my-project/secrets/other-secret/versions/1
          vpc_connector: projects/my-project/locations/us-central1/connectors/my-connector
      - name: Assert action ran or failed gracefully (no GCP credentials available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no GCP credentials in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
