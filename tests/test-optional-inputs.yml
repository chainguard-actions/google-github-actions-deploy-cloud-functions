name: Test optional inputs (env vars, labels, memory, cpu)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: deploy
        uses: .
        continue-on-error: true
        with:
          name: test-function
          runtime: nodejs20
          project_id: my-test-project
          region: us-east1
          environment: GEN_2
          memory: 256M
          cpu: '1'
          service_timeout: 120s
          min_instance_count: '0'
          max_instance_count: '10'
          ingress_settings: ALLOW_ALL
          environment_variables: |-
            FOO=bar
            BAZ=qux
          labels: |-
            env=test
            team=platform

      - name: Assert action ran with optional inputs (failed gracefully without real GCP credentials)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
          NAME_OUTPUT: ${{ steps.deploy.outputs.name }}
          URL_OUTPUT: ${{ steps.deploy.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "name output: $NAME_OUTPUT"
          echo "url output: $URL_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NAME_OUTPUT" ]; then
              echo "FAIL: action succeeded but 'name' output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with name='$NAME_OUTPUT' url='$URL_OUTPUT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real GCP credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
