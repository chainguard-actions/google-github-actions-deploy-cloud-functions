name: Test optional inputs (no credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-test-function
          runtime: nodejs18
          region: us-east1
          description: A test Cloud Function
          memory_mb: '512'
          timeout: '120s'
          min_instances: '0'
          max_instances: '10'
          env_vars: KEY1=VALUE1,KEY2=VALUE2
          labels: env=test,team=platform
          ingress_settings: ALLOW_ALL
          https_trigger_security_level: SECURE_ALWAYS

      - name: Assert action failed gracefully with optional inputs (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but valid if credentials were injected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected without GCP credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
