name: Test deploy with build and security options
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-secure-function
          runtime: nodejs20
          region: us-central1
          project_id: my-gcp-project
          entry_point: myHandler
          service_account: my-sa@my-gcp-project.iam.gserviceaccount.com
          kms_key_name: projects/my-gcp-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key
          docker_repository: projects/my-gcp-project/locations/us-central1/repositories/my-repo
          build_service_account: build-sa@my-gcp-project.iam.gserviceaccount.com
          build_worker_pool: projects/my-gcp-project/locations/us-central1/workerPools/my-pool
          build_environment_variables: |-
            BUILD_VAR=build-value
            ANOTHER_VAR=another-value
          max_instance_request_concurrency: '10'
          secrets: |-
            SECRET_KEY=my-secret:latest
          vpc_connector: projects/my-gcp-project/locations/us-central1/connectors/my-connector
          vpc_connector_egress_settings: ALL_TRAFFIC

      - name: Assert action ran and failed gracefully (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          URL: ${{ steps.action.outputs.url }}
          FUNC_NAME: ${{ steps.action.outputs.name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "name: $FUNC_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FUNC_NAME" ]; then
              echo "FAIL: action succeeded but name output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with name=$FUNC_NAME"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no GCP credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
