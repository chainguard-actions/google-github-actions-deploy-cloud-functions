name: Test build config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-function
          runtime: nodejs20
          project_id: my-gcp-project
          build_environment_variables: |-
            NODE_ENV=production
            BUILD_FLAG=true
          build_service_account: build-sa@my-gcp-project.iam.gserviceaccount.com
          build_worker_pool: projects/my-gcp-project/locations/us-central1/workerPools/my-pool
          docker_repository: projects/my-gcp-project/locations/us-central1/repositories/gcf-artifacts
          entry_point: myFunctionHandler
      - name: Assert action ran (may fail due to missing GCP credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked"
