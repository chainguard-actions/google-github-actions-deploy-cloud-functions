name: Test build configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-cloud-function
          runtime: nodejs20
          project_id: my-gcp-project
          build_environment_variables: |-
            FRUIT=apple
            COLOR=blue
          build_service_account: build-sa@my-gcp-project.iam.gserviceaccount.com
          build_worker_pool: projects/my-gcp-project/locations/us-central1/workerPools/my-pool
          docker_repository: projects/my-gcp-project/locations/us-central1/repositories/gcf-artifacts
          entry_point: myFunction
      - name: Assert action ran (expected failure without GCP credentials)
        run: |
          echo "Action completed (with or without error — no GCP credentials available in test)"
          echo "PASS: build config inputs were accepted"
