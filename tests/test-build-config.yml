name: Test build config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-test-function
          runtime: nodejs20
          project_id: my-gcp-project
          entry_point: helloWorld
          build_service_account: build-sa@my-gcp-project.iam.gserviceaccount.com
          build_worker_pool: projects/my-gcp-project/locations/us-central1/workerPools/my-pool
          docker_repository: projects/my-gcp-project/locations/us-central1/repositories/my-repo
          kms_key_name: projects/my-gcp-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key
      - name: Assert action ran (outputs set or failed gracefully without GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NAME_OUT: ${{ steps.action.outputs.name }}
          URL_OUT: ${{ steps.action.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "name output: $NAME_OUT"
          echo "url output: $URL_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NAME_OUT" ]; then
              echo "FAIL: action succeeded but 'name' output is empty"
              exit 1
            fi
            echo "PASS: got name='$NAME_OUT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no GCP credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
